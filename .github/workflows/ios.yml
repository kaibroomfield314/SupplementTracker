name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (generic iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode 26+
        run: |
          set -euo pipefail
          CANDIDATES=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V || true)
          if [ -z "$CANDIDATES" ]; then
            echo "::warning::No Xcode 26 found on runner; falling back to default Xcode. Build will likely fail because deployment target is iOS 26."
            xcodebuild -version
            exit 0
          fi
          XCODE_PATH=$(echo "$CANDIDATES" | tail -1)
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          if ls *.xcworkspace >/dev/null 2>&1; then
            container=("-workspace" "$(ls -d *.xcworkspace | head -1)")
          else
            container=("-project" "$(ls -d *.xcodeproj | head -1)")
          fi
          xcodebuild \
            "${container[@]}" \
            -scheme SupplementTracker \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
