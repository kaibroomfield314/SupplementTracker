name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (generic iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          if ls *.xcworkspace >/dev/null 2>&1; then
            container=("-workspace" "$(ls -d *.xcworkspace | head -1)")
          else
            container=("-project" "$(ls -d *.xcodeproj | head -1)")
          fi
          xcodebuild \
            "${container[@]}" \
            -scheme SupplementTracker \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
